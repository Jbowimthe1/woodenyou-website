name: Publish WoodenYou to GoDaddy

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - '.github/workflows/publish-woodenyou.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woodenyou-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Securely publish site files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GoDaddy FTPS certificate covers *.prod.phx3.secureserver.net.
      # Resolve this alias to the hosting IP confirmed by the account owner.
      FTP_HOST: woodenyou.prod.phx3.secureserver.net
      FTP_USER: ${{ secrets.GODADDY_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.GODADDY_FTP_PASSWORD }}
    steps:
      - name: Report missing connection setup
        if: ${{ env.FTP_HOST == '' || env.FTP_USER == '' || env.FTP_PASS == '' }}
        run: |
          echo 'GoDaddy publishing is not connected yet. Create repository Actions secrets GODADDY_FTP_SERVER, GODADDY_FTP_USERNAME, and GODADDY_FTP_PASSWORD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No site files were changed.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out website
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        uses: actions/checkout@v6

      - name: Package only public website files
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          cp index.html about.html beams.html contact.html custom.html gallery.html melted-edge.html publish/
          cp -R assets publish/assets

      - name: Resolve verified GoDaddy server address with matching TLS identity
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          printf '132.148.178.15 woodenyou.prod.phx3.secureserver.net\n' | sudo tee -a /etc/hosts
          getent hosts woodenyou.prod.phx3.secureserver.net

      - name: Deploy by encrypted FTPS
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./publish/
          server-dir: ./
          security: strict
          dangerous-clean-slate: false
          log-level: standard


      - name: Verify the live site shows the $425 board and five photos
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 \
              "https://woodenyou.us/melted-edge.html?deployed=${GITHUB_SHA}" -o /tmp/woodenyou-board.html &&
              grep -q 'Melted Edge Cutting Board' /tmp/woodenyou-board.html &&
              grep -q '\$425' /tmp/woodenyou-board.html &&
              [ "$(grep -o 'static.metricool.com/planner/' /tmp/woodenyou-board.html | wc -l)" -ge 5 ]; then
              echo 'Live Melted Edge page verified with $425 price and five photograph references.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Deployment ran, but the live Melted Edge page could not be verified.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify actual live gallery photographs
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/gallery.html?verify=${GITHUB_SHA}" -o /tmp/woodenyou-gallery.html &&
              grep -q 'id="white-oak-serving-tray"' /tmp/woodenyou-gallery.html &&
              grep -q 'id="yukon-66-coasters"' /tmp/woodenyou-gallery.html &&
              grep -q '\$89' /tmp/woodenyou-gallery.html; then
              all_good=1
              for photo in white-oak-tray.jpg puzzle-serving-trays.jpg bamx-bourbon-board.jpg cherry-board-supports.jpg yukon-66-coasters.jpg; do
                if ! curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/assets/products/${photo}?verify=${GITHUB_SHA}" -o /tmp/woodenyou-product-photo.jpg; then
                  all_good=0
                  break
                fi
                if [ "$(wc -c < /tmp/woodenyou-product-photo.jpg)" -lt 10000 ]; then
                  echo "Photo too small or not a real image: ${photo}"
                  all_good=0
                  break
                fi
              done
              if [ "${all_good}" -eq 1 ]; then
                echo 'Verified live gallery with priced White Oak and Yukon listings and all five real photo files.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 8
          done
          echo 'Upload ran but the new public gallery listings or product photos did not verify.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify the live PawPrint gallery hero matches the approved photo
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/gallery.html?pawprint-check=${GITHUB_SHA}" -o /tmp/woodenyou-pawprint-gallery.html &&
              grep -q 'id="pawprint-serving-tray"' /tmp/woodenyou-pawprint-gallery.html &&
              grep -q 'src="assets/products/pawprint-serving-tray-hero.webp"' /tmp/woodenyou-pawprint-gallery.html &&
              grep -q '\$75' /tmp/woodenyou-pawprint-gallery.html &&
              curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/assets/products/pawprint-serving-tray-hero.webp?pawprint-check=${GITHUB_SHA}" -o /tmp/woodenyou-pawprint-hero.webp &&
              cmp -s publish/assets/products/pawprint-serving-tray-hero.webp /tmp/woodenyou-pawprint-hero.webp; then
              echo 'Verified live $75 PawPrint gallery card and exact approved tabletop photograph.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 8
          done
          echo 'PawPrint gallery or approved hero photo failed direct public-site verification.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify $950 finished Legacy Flag and $99 BamX front and reverse on live site
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/gallery.html?flag-bamx-check=${GITHUB_SHA}" -o /tmp/woodenyou-new-gallery.html &&
              grep -q 'id="legacy-wavy-flag"' /tmp/woodenyou-new-gallery.html &&
              grep -q 'Wavy Wooden American Flag' /tmp/woodenyou-new-gallery.html &&
              grep -q '\$950' /tmp/woodenyou-new-gallery.html &&
              grep -q 'id="bamx-bourbon-board"' /tmp/woodenyou-new-gallery.html &&
              grep -q '\$99' /tmp/woodenyou-new-gallery.html &&
              grep -q 'src="assets/products/bamx-bourbon-board-front.jpg"' /tmp/woodenyou-new-gallery.html &&
              grep -q 'src="assets/products/bamx-bourbon-board.jpg"' /tmp/woodenyou-new-gallery.html; then
              all_good=1
              for photo in legacy-wavy-flag-finished-main.jpg legacy-wavy-flag-finished-outdoor.jpg legacy-wavy-flag-finished-angle.jpg bamx-bourbon-board-front.jpg; do
                if ! curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/assets/products/${photo}?flag-bamx-check=${GITHUB_SHA}" -o /tmp/woodenyou-check-photo.jpg ||
                   ! cmp -s "publish/assets/products/${photo}" /tmp/woodenyou-check-photo.jpg; then
                  all_good=0
                  break
                fi
              done
              if [ "${all_good}" -eq 1 ]; then
                echo 'Verified the exact real $950 finished flag photos and $99 BamX front image on the public GoDaddy site.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 8
          done
          echo 'Live Flag or BamX photos and prices could not be independently verified.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify $279 Bowen listing with user-provided original photos
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/gallery.html?real-bowen-check=${GITHUB_SHA}" -o /tmp/woodenyou-real-bowen.html &&
              grep -q 'id="bowen-family-inlay"' /tmp/woodenyou-real-bowen.html &&
              grep -q 'Family Name Cutting Board' /tmp/woodenyou-real-bowen.html &&
              grep -q 'Est June 7, 1985' /tmp/woodenyou-real-bowen.html &&
              grep -q '\$279' /tmp/woodenyou-real-bowen.html &&
              ! grep -q '\$139 personalized' /tmp/woodenyou-real-bowen.html &&
              grep -q 'src="assets/products/bowen-family-board-actual-kitchen.jpg"' /tmp/woodenyou-real-bowen.html &&
              ! grep -q 'src="assets/products/bowen-family-inlay-front.jpg"' /tmp/woodenyou-real-bowen.html; then
              good=1
              for photo in bowen-family-board-actual-kitchen.jpg bowen-family-board-actual-workshop.jpg bowen-family-board-actual-workshop-wide.jpg; do
                if ! curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/assets/products/${photo}?real-bowen-check=${GITHUB_SHA}" -o /tmp/woodenyou-real-bowen-photo.jpg ||
                  ! cmp -s "publish/assets/products/${photo}" /tmp/woodenyou-real-bowen-photo.jpg; then
                  good=0
                  break
                fi
              done
              if [ "${good}" -eq 1 ]; then
                echo 'Verified $279 Bowen price, engraved text, and exact user-supplied product photographs on live WoodenYou.us.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 8
          done
          echo 'New Bowen front images failed public-site verification.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify actual public-page copy and absence of placeholders
        if: \${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/?content-check=\${GITHUB_SHA}" -o /tmp/woodenyou-new-home.html &&
              curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/about.html?content-check=\${GITHUB_SHA}" -o /tmp/woodenyou-new-about.html &&
              curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/custom.html?content-check=\${GITHUB_SHA}" -o /tmp/woodenyou-new-custom.html &&
              curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/contact.html?content-check=\${GITHUB_SHA}" -o /tmp/woodenyou-new-contact.html &&
              curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/gallery.html?content-check=\${GITHUB_SHA}" -o /tmp/woodenyou-new-gallery-copy.html &&
              grep -Fq 'Real wood. Real workmanship.' /tmp/woodenyou-new-home.html &&
              grep -Fq 'Made by hand in Newcastle, Oklahoma.' /tmp/woodenyou-new-about.html &&
              grep -Fq 'Business, club &amp; group orders' /tmp/woodenyou-new-custom.html &&
              grep -Fq 'Request an order or custom quote' /tmp/woodenyou-new-contact.html &&
              grep -Fq 'More actual WoodenYou pieces' /tmp/woodenyou-new-gallery-copy.html &&
              ! grep -Fq 'This page tells the story behind WoodenYou' /tmp/woodenyou-new-about.html &&
              ! grep -Fq 'This page can later hold pricing guidance' /tmp/woodenyou-new-custom.html &&
              ! grep -Fq 'CNC Preciscion' /tmp/woodenyou-new-home.html; then
              echo 'Verified all five updated public pages show authentic copy; both known placeholder passages are gone.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 8
          done
          echo 'Public site failed placeholder-removal or authentic-page-copy verification.' >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify direct email order route on all public sales pages
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html gallery.html contact.html melted-edge.html; do
            verified=0
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/${page}?direct-email-check=${GITHUB_SHA}" -o /tmp/woodenyou-direct-email.html &&
                grep -Fq 'mailto:woodenyoushop@gmail.com?subject=WoodenYou%20Order%20Inquiry' /tmp/woodenyou-direct-email.html &&
                grep -Fq 'Email an order directly' /tmp/woodenyou-direct-email.html; then
                verified=1
                break
              fi
              sleep 8
            done
            if [ "$verified" -ne 1 ]; then
              echo "Public direct-email order link verification failed: ${page}"
              exit 1
            fi
          done
          echo "Verified direct-email ordering links on all four public sales pages." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify all locally referenced photos across every public page
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class ImageRefs(HTMLParser):
              def __init__(self): super().__init__(); self.refs=set()
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if tag == 'img':
                      src=data.get('src','')
                      if src.startswith('assets/'): self.refs.add(src)
                  if tag == 'link' and data.get('rel') == 'stylesheet':
                      src=data.get('href','')
                      if src.startswith('assets/'): self.refs.add(src)
          assets={'assets/wood-bg.jpg'}
          for path in Path('publish').glob('*.html'):
              p=ImageRefs(); p.feed(path.read_text(encoding='utf-8'))
              assets.update(p.refs)
          for asset in sorted(assets): print(asset)
          PY
          )
          failures=0
          echo "Public asset check on ${#assets[@]} image or stylesheet paths"
          for asset in "${assets[@]}"; do
            status="$(curl --location --silent --show-error --max-time 15 --output /tmp/woodenyou-live-asset --write-out '%{http_code}' "https://woodenyou.us/${asset}?audit=${GITHUB_SHA}" || true)"
            size="$(wc -c < /tmp/woodenyou-live-asset 2>/dev/null || echo 0)"
            if [ "$status" = "200" ] && [ "$size" -gt 2000 ]; then
              echo "VERIFIED $asset ($size bytes)"
            else
              echo "::error::Broken public asset: $asset (HTTP $status, $size bytes)"
              failures=$((failures+1))
            fi
          done
          echo "Broken currently referenced public files: $failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - name: Verify complete PawPrint product appears first without cropping
        if: ${{ env.FTP_HOST != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/index.html?pawprint-first=${GITHUB_SHA}" -o /tmp/woodenyou-home-pawprint.html &&
               curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/gallery.html?pawprint-first=${GITHUB_SHA}" -o /tmp/woodenyou-gallery-pawprint.html &&
               grep -Fq 'src="assets/products/pawprint-serving-tray-hero.webp"' /tmp/woodenyou-home-pawprint.html &&
               grep -Fq 'src="assets/products/pawprint-serving-tray-hero.webp"' /tmp/woodenyou-gallery-pawprint.html &&
               grep -Fq 'object-fit:contain;object-position:center;background:#211810' /tmp/woodenyou-home-pawprint.html &&
               grep -Fq 'object-fit:contain;object-position:center;background:#211810' /tmp/woodenyou-gallery-pawprint.html &&
               ! grep -Fq 'src="assets/products/pawprint-serving-tray.jpg"' /tmp/woodenyou-home-pawprint.html &&
               curl --fail --silent --show-error --location --max-time 20 "https://woodenyou.us/assets/products/pawprint-serving-tray-hero.webp?verify=${GITHUB_SHA}" -o /tmp/woodenyou-hero-complete.webp &&
               cmp -s publish/assets/products/pawprint-serving-tray-hero.webp /tmp/woodenyou-hero-complete.webp; then
              echo "Verified finished full PawPrint image first on homepage and gallery, with non-cropping layout, on live site." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 8
          done
          echo 'PawPrint first-photo or full-product layout could not be verified on live site.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
